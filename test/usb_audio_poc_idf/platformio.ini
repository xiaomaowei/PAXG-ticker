; Isolated PlatformIO ESP-IDF Project for USB Audio Class (UAC) Feasibility Proof
; Target: ESP32-S3 (LilyGo T-Display-S3)
; Component: Espressif official esp_device_uac (espressif/usb_device_uac)

[platformio]
default_envs = esp32s3_uac_poc
src_dir = main

[env:esp32s3_uac_poc]
platform = espressif32 @ 6.5.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
