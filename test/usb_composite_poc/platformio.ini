; Isolated PlatformIO ESP-IDF Project for Simultaneous USB Composite (UAC Speaker + HID Keyboard)
; Target: ESP32-S3 (LilyGo T-Display-S3)
; Components: TinyUSB with Audio and HID drivers enabled

[platformio]
default_envs = esp32s3_composite_poc
src_dir = main

[env:esp32s3_composite_poc]
platform = espressif32 @ 6.5.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
