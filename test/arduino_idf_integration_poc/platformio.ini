; Isolated PlatformIO ESP-IDF 5.x Project with Arduino as Component
; Target: ESP32-S3 (LilyGo T-Display-S3)
; Framework: ESP-IDF 5.1.2 (framework = espidf)

[platformio]
default_envs = esp32s3_arduino_idf_poc
src_dir = main

[env:esp32s3_arduino_idf_poc]
platform = espressif32 @ 6.5.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -Wno-deprecated-declarations
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
